{% extends "base.html" %}
{% block titulo %}Trocar senha · Última Volta Brasil{% endblock %}
{% block conteudo %}
<section class="caixa-login">
  <h1>Trocar senha</h1>
  {% if obrigatoria %}
    <p class="sub">Primeiro acesso: crie uma senha só sua para continuar.</p>
  {% else %}
    <p class="sub">Mínimo de {{ senha_min }} caracteres.</p>
  {% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>{{ 'Senha recebida do professor' if obrigatoria else 'Senha atual' }}
      <input type="password" name="atual" required autofocus autocomplete="current-password">
    </label>
    <label>Nova senha
      <input type="password" name="nova" required minlength="{{ senha_min }}" autocomplete="new-password">
    </label>
    <label>Repita a nova senha
      <input type="password" name="confirmacao" required minlength="{{ senha_min }}" autocomplete="new-password">
    </label>
    <button class="btn btn-grande" type="submit">Salvar nova senha</button>
  </form>
</section>
{% endblock %}
